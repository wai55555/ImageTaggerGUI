ApiKey_Steps_Gemini = 1. 「APIキー取得ページを開く」を押します（必要なら Google にログイン）。\n2. APIキーを作成してコピーします。\n3. 下の欄に貼り付けて「確認して保存」を押します。
ApiKey_Steps_OpenRouter = 1. 「APIキー取得ページを開く」を押します（必要なら OpenRouter にログイン/サインアップ）。\n2. キーを作成してコピーします。\n3. 下の欄に貼り付けて「確認して保存」を押します。
ApiKey_Steps_Cloudflare = 1. 「APIキー取得ページを開く」→ Workers AI の「Use REST API」を開き、テンプレートから Workers AI API Token を作成します。\n2. 独自にトークンを作る場合は Account の Workers AI Read と Edit の両権限を付け、下の欄にアカウントIDも入力します。\n3. トークンを貼り付けて「確認して保存」を押します。Workers AI へ実際の画像リクエストが成功した場合だけ画面が閉じます。
ApiKey_Steps_Generic = 1. 提供元のページを開き、必要ならログインします。\n2. APIキーを作成してコピーします。\n3. 下の欄に貼り付けて「確認して保存」を押します。
ApiKey_Steps_Groq = 1. Groq コンソールのキー画面を開きます（必要ならログイン/サインアップ）。\n2. APIキーを作成してコピーします。\n3. 下の欄に貼り付けて「確認して保存」を押します。
ApiKey_Steps_Nvidia = 1. build.nvidia.com の API キー画面を開きます（必要ならログイン/サインアップ）。\n2. APIキーを発行してコピーします。\n3. 下の欄に貼り付けて「確認して保存」を押します。
ApiKey_Steps_Mistral = 1. Mistral コンソールの API キー画面を開きます（必要ならログイン/サインアップ）。\n2. APIキーを作成してコピーします。\n3. 下の欄に貼り付けて「確認して保存」を押します。
ApiKey_Steps_HuggingFace = 1. Hugging Face のトークン設定を開きます（必要ならログイン/サインアップ）。\n2. Inference Providers の呼び出し権限を持つ fine-grained トークンを作成してコピーします。\n3. 下の欄に貼り付けて「確認して保存」を押します。
ApiKey_Steps_Vercel = 1. Vercel の AI Gateway API キー画面を開きます（必要ならログイン/サインアップ）。\n2. APIキーを作成してコピーします。無料クレジットの有効化にも有効なカードを要求される場合があります。意図しない課金を防ぐため、キーごとの予算上限も設定してください。\n3. 下の欄に貼り付けて「確認して保存」を押します。
ApiKey_Steps_OpenAI = 1. OpenAI Platform の API キー画面を開きます（必要ならログイン）。\n2. APIキーを作成してコピーします。\n3. 下の欄に貼り付けて「確認して保存」を押します。
ApiKey_Steps_Anthropic = 1. Anthropic Console の API キー画面を開き、APIキーを作成してコピーします。\n2. 複数Workspace対象のpersonal/service-account keyでは、Settings → Workspaces の wrkspc_... IDも入力します。単一Workspaceにスコープしたキーでは空欄で構いません。\n3. キーを貼り付けて「確認して保存」を押します。
ApiKey_Steps_Xai = 1. xAI コンソールの API キー画面を開きます（必要ならサインイン / サインアップ）。\n2. APIキー（xai- で始まる）を作成してコピーします。\n3. 下に貼り付けて「確認して保存」を押します。
# ApiKey_Steps_OVHcloud = 対応地域の利用者が実機検証できるまで無効
ApiKey_Not_Reached = キーを検証するためにサービスへ到達できませんでした

