Custom_Insecure_Auth_Warning = Diese externe URL verwendet unverschlüsseltes HTTP. Bilddaten und ein konfigurierter API-Schlüssel können während der Übertragung abgefangen werden. Möchten Sie diese Verbindung trotzdem verwenden?
ApiKey_Saved_Model_Warning = Der Schlüssel wurde akzeptiert und in {where} gespeichert, aber die Anfrage ergab: {detail}. Korrigieren Sie die Modell-ID für diese Route und führen Sie die Diagnose erneut aus.
ApiKey_Service_Warning = {success} Der Dienst kann jedoch noch keine Anfragen ausführen: {detail}. Überprüfen Sie die Abrechnung, die Zahlungsmethode oder das Guthaben des Kontos und führen Sie anschließend die Diagnose erneut aus.
ApiKey_Steps_Gemini = 1. Öffnen Sie die API-Schlüssel-Seite (melden Sie sich bei Bedarf bei Google an).\n2. Erstellen Sie einen API-Schlüssel und kopieren Sie ihn.\n3. Fügen Sie ihn unten ein und klicken Sie auf "Überprüfen und speichern".
ApiKey_Steps_OpenRouter = 1. Öffnen Sie die Schlüssel-Seite (melden Sie sich bei Bedarf bei OpenRouter an oder registrieren Sie sich).\n2. Erstellen Sie einen Schlüssel und kopieren Sie ihn.\n3. Fügen Sie ihn unten ein und klicken Sie auf "Überprüfen und speichern".
ApiKey_Steps_Cloudflare = 1. Öffnen Sie Workers AI, wählen Sie "Use REST API" und erstellen Sie aus der Vorlage ein Workers AI API Token.\n2. Wenn Sie ein eigenes Token erstellen, gewähren Sie sowohl die Berechtigung Account / Workers AI Read als auch Edit und geben Sie unten Ihre Konto-ID ein.\n3. Fügen Sie das Token ein und klicken Sie auf "Überprüfen und speichern". Das Fenster schließt sich erst, wenn eine tatsächliche Bildanfrage an Workers AI erfolgreich war.
ApiKey_Steps_Generic = 1. Öffnen Sie die Seite des Anbieters und melden Sie sich bei Bedarf an.\n2. Erstellen Sie einen API-Schlüssel und kopieren Sie ihn.\n3. Fügen Sie ihn unten ein und klicken Sie auf "Überprüfen und speichern".
ApiKey_Steps_Groq = 1. Öffnen Sie die Schlüssel-Seite der Groq-Konsole (melden Sie sich bei Bedarf an oder registrieren Sie sich).\n2. Erstellen Sie einen API-Schlüssel und kopieren Sie ihn.\n3. Fügen Sie ihn unten ein und klicken Sie auf "Überprüfen und speichern".
ApiKey_Steps_Nvidia = 1. Öffnen Sie die API-Schlüssel-Seite von build.nvidia.com (melden Sie sich bei Bedarf an oder registrieren Sie sich).\n2. Erstellen Sie einen API-Schlüssel und kopieren Sie ihn.\n3. Fügen Sie ihn unten ein und klicken Sie auf "Überprüfen und speichern".
ApiKey_Steps_Mistral = 1. Öffnen Sie die API-Schlüssel-Seite der Mistral-Konsole (melden Sie sich bei Bedarf an oder registrieren Sie sich).\n2. Erstellen Sie einen API-Schlüssel und kopieren Sie ihn.\n3. Fügen Sie ihn unten ein und klicken Sie auf "Überprüfen und speichern".
ApiKey_Steps_HuggingFace = 1. Öffnen Sie die Token-Einstellungen von Hugging Face (melden Sie sich bei Bedarf an oder registrieren Sie sich).\n2. Erstellen Sie ein Fine-grained-Token mit der Berechtigung, Inference Providers aufzurufen, und kopieren Sie es.\n3. Fügen Sie es unten ein und klicken Sie auf "Überprüfen und speichern".
ApiKey_Steps_Vercel = 1. Öffnen Sie die API-Schlüssel-Seite des Vercel AI Gateway (melden Sie sich bei Bedarf an oder registrieren Sie sich).\n2. Erstellen Sie einen API-Schlüssel und kopieren Sie ihn. Vercel verlangt möglicherweise eine gültige Karte, bevor die kostenlosen Guthaben freigeschaltet werden; legen Sie ein Budget pro Schlüssel fest, um unbeabsichtigte Kosten zu vermeiden.\n3. Fügen Sie ihn unten ein und klicken Sie auf "Überprüfen und speichern".
ApiKey_Steps_OpenAI = 1. Öffnen Sie die API-Schlüssel-Seite der OpenAI Platform (melden Sie sich bei Bedarf an).\n2. Erstellen Sie einen API-Schlüssel und kopieren Sie ihn.\n3. Fügen Sie ihn unten ein und klicken Sie auf "Überprüfen und speichern".
ApiKey_Steps_Anthropic = 1. Öffnen Sie die API-Schlüssel-Seite der Anthropic Console, erstellen Sie einen API-Schlüssel und kopieren Sie ihn.\n2. Bei einem Personal-/Service-Account-Key für mehrere Workspaces geben Sie zusätzlich die wrkspc_...-ID aus Settings → Workspaces ein. Bei einem auf einen einzelnen Workspace beschränkten Key lassen Sie das Feld leer.\n3. Fügen Sie den Schlüssel ein und klicken Sie auf "Überprüfen und speichern".
ApiKey_Steps_Xai = 1. Öffnen Sie die API-Schlüssel-Seite der xAI-Konsole (melden Sie sich bei Bedarf an oder registrieren Sie sich).\n2. Erstellen Sie einen API-Schlüssel (beginnt mit xai-) und kopieren Sie ihn.\n3. Fügen Sie ihn unten ein und klicken Sie auf "Überprüfen und speichern".
# ApiKey_Steps_OVHcloud = deaktiviert, bis ein Nutzer aus einer unterstützten Region den Dienst verifizieren kann
ApiKey_Not_Reached = der Dienst konnte zur Überprüfung des Schlüssels nicht erreicht werden

[Gpu]
Prompt_Title = GPU-Beschleunigung
Prompt_Body = Es ist eine NVIDIA-GPU verfügbar. Möchten Sie die GPU-Komponenten ({size}) einmalig herunterladen, um das lokale Tagging auf der GPU auszuführen? (Captioning läuft immer auf der CPU.) Die App funktioniert in jedem Fall auch weiterhin auf der CPU.
Prompt_Download = Herunterladen
Prompt_Later = Nicht jetzt
