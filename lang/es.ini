ApiKey_Steps_Gemini = 1. Pulsa "Abrir la página de claves de API" (inicia sesión en Google si se te pide).\n2. Crea una clave de API y cópiala.\n3. Pégala abajo y pulsa "Verificar y guardar".
ApiKey_Steps_OpenRouter = 1. Abre la página de claves (inicia sesión o regístrate en OpenRouter si es necesario).\n2. Crea una clave y cópiala.\n3. Pégala abajo y pulsa "Verificar y guardar".
ApiKey_Steps_Cloudflare = 1. Abre Workers AI, selecciona "Use REST API" y crea un Workers AI API Token a partir de su plantilla.\n2. Si creas un token personalizado, concede los permisos Account / Workers AI Read y Edit, y luego introduce tu ID de cuenta abajo.\n3. Pega el token y pulsa "Verificar y guardar". El diálogo solo se cierra cuando una solicitud de imagen real a Workers AI se realiza con éxito.
ApiKey_Steps_Generic = 1. Abre la página del proveedor e inicia sesión si es necesario.\n2. Crea una clave de API y cópiala.\n3. Pégala abajo y pulsa "Verificar y guardar".
ApiKey_Steps_Groq = 1. Abre la página de claves de la consola de Groq (inicia sesión o regístrate si es necesario).\n2. Crea una clave de API y cópiala.\n3. Pégala abajo y pulsa "Verificar y guardar".
ApiKey_Steps_Nvidia = 1. Abre la página de claves de API de build.nvidia.com (inicia sesión o regístrate si es necesario).\n2. Genera una clave de API y cópiala.\n3. Pégala abajo y pulsa "Verificar y guardar".
ApiKey_Steps_Mistral = 1. Abre la página de claves de API de la consola de Mistral (inicia sesión o regístrate si es necesario).\n2. Crea una clave de API y cópiala.\n3. Pégala abajo y pulsa "Verificar y guardar".
ApiKey_Steps_HuggingFace = 1. Abre la configuración de tokens de Hugging Face (inicia sesión o regístrate si es necesario).\n2. Crea un token de grano fino con permiso para llamar a Inference Providers y cópialo.\n3. Pégalo abajo y pulsa "Verificar y guardar".
ApiKey_Steps_Vercel = 1. Abre la página de claves de API de Vercel AI Gateway (inicia sesión o regístrate si es necesario).\n2. Crea y copia una clave de API. Vercel puede requerir una tarjeta válida para desbloquear sus créditos gratuitos; establece un límite de presupuesto por clave para evitar cargos no deseados.\n3. Pégala abajo y pulsa "Verificar y guardar".
ApiKey_Steps_OpenAI = 1. Abre la página de claves de API de OpenAI Platform (inicia sesión si es necesario).\n2. Crea una clave de API y cópiala.\n3. Pégala abajo y pulsa "Verificar y guardar".
ApiKey_Steps_Anthropic = 1. Abre Anthropic Console, crea una clave de API y cópiala.\n2. Para una clave personal o de cuenta de servicio con varios workspaces, introduce también el ID wrkspc_... de Settings → Workspaces. Déjalo en blanco si la clave está limitada a un solo workspace.\n3. Pega la clave y pulsa "Verificar y guardar".
ApiKey_Steps_Xai = 1. Abre la página de claves de API de la consola de xAI (inicia sesión o regístrate si es necesario).\n2. Crea una clave de API (empieza por xai-) y cópiala.\n3. Pégala abajo y pulsa "Verificar y guardar".
# ApiKey_Steps_OVHcloud = deshabilitado hasta que un usuario de una región compatible pueda verificar el servicio
ApiKey_Not_Reached = no se pudo contactar con el servicio para verificar la clave
