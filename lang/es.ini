[ModelDescriptions]
pixai-tagger-v0.9 = 13.461 etiquetas. De uso general, pero débil con los fondos.
wd_eva02_large_v3 = 10.861 etiquetas. La opción habitual; elige esta si los falsos positivos te resultan molestos.
oppaioracle_v1_1 = 19.294 etiquetas. Solo etiquetas generales.
camie_tagger_v2 = 70.527 etiquetas. Destaca por la detección de etiquetas de artista, aunque la precisión no es muy alta y el gran número de etiquetas conlleva un riesgo elevado de falsos positivos.
cl_tagger_1_02 = 51.213 etiquetas. Destaca por las etiquetas de calidad y las etiquetas de modelo (26).
cl_tagger_v2_01a = 108.036 etiquetas. Vocabulario muy amplio; sin etiquetas de modelo.
wd14_convnextv2 = 9.083 etiquetas. Rápido.
wd_eva02_2026_canary = 16.473 etiquetas. Modelo WD-eva02 experimental más reciente.
florence2_base_ft = Genera descripciones en lenguaje natural.

