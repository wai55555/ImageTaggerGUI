ApiKey_Failed_Generic = 키가 거부되었습니다
ApiKey_Failed = 확인 실패: {detail}
ApiKey_Stored_Keyring = OS 보안 저장소
ApiKey_Stored_Session = 이번 세션에서만 유지됩니다. OS 보안 저장소를 찾을 수 없습니다. 재시작 후에도 유지하려면 keyring 패키지를 설치하거나 프로바이더의 API 키 환경 변수를 설정하세요.
ApiKey_Saved_Confirm = 연결을 확인했습니다. API 키를 {where}에 저장했습니다.
ApiKey_Connected_Existing = 등록된 API 키로 연결을 확인하고 연결 설정을 저장했습니다.
Custom_Insecure_Auth_Title = 암호화되지 않은 외부 연결
Custom_Insecure_Auth_Warning = 이 외부 URL은 평문 HTTP를 사용합니다. 통신 중 이미지 데이터와 설정된 API 키가 도청될 수 있습니다. 이 연결을 계속 사용하시겠습니까?
ApiKey_Saved_Model_Warning = 키는 정상적으로 받아들여져 {where}에 저장했지만, 요청에 대한 응답은 "{detail}"였습니다. 이 경로의 모델 ID를 수정한 뒤 "연결 진단"을 다시 실행하세요.
ApiKey_Service_Warning = {success} 다만 서비스가 아직 요청을 실행할 수 없습니다: {detail} 계정의 결제 설정, 결제 수단, 크레딧 잔액을 확인한 뒤 "연결 진단"을 다시 실행하세요.
ApiKey_Steps_Gemini = 1. "API 키 발급 페이지 열기"를 누릅니다(필요하면 Google에 로그인).\n2. API 키를 생성해 복사합니다.\n3. 아래 입력란에 붙여넣고 "확인하고 저장"을 누릅니다.
ApiKey_Steps_OpenRouter = 1. "API 키 발급 페이지 열기"를 누릅니다(필요하면 OpenRouter에 로그인/가입).\n2. 키를 생성해 복사합니다.\n3. 아래 입력란에 붙여넣고 "확인하고 저장"을 누릅니다.
ApiKey_Steps_Cloudflare = 1. "API 키 발급 페이지 열기" → Workers AI의 "Use REST API"를 열고, 템플릿에서 Workers AI API Token을 생성합니다.\n2. 직접 토큰을 만드는 경우 Account의 Workers AI Read와 Edit 권한을 모두 부여하고, 아래 입력란에 계정 ID도 입력합니다.\n3. 토큰을 붙여넣고 "확인하고 저장"을 누릅니다. Workers AI로 실제 이미지 요청이 성공한 경우에만 창이 닫힙니다.
ApiKey_Steps_Generic = 1. 제공처 페이지를 열고 필요하면 로그인합니다.\n2. API 키를 생성해 복사합니다.\n3. 아래 입력란에 붙여넣고 "확인하고 저장"을 누릅니다.
ApiKey_Steps_Groq = 1. Groq 콘솔의 키 화면을 엽니다(필요하면 로그인/가입).\n2. API 키를 생성해 복사합니다.\n3. 아래 입력란에 붙여넣고 "확인하고 저장"을 누릅니다.
ApiKey_Steps_Nvidia = 1. build.nvidia.com의 API 키 화면을 엽니다(필요하면 로그인/가입).\n2. API 키를 발급해 복사합니다.\n3. 아래 입력란에 붙여넣고 "확인하고 저장"을 누릅니다.
ApiKey_Steps_Mistral = 1. Mistral 콘솔의 API 키 화면을 엽니다(필요하면 로그인/가입).\n2. API 키를 생성해 복사합니다.\n3. 아래 입력란에 붙여넣고 "확인하고 저장"을 누릅니다.
ApiKey_Steps_HuggingFace = 1. Hugging Face의 토큰 설정을 엽니다(필요하면 로그인/가입).\n2. Inference Providers 호출 권한을 가진 fine-grained 토큰을 생성해 복사합니다.\n3. 아래 입력란에 붙여넣고 "확인하고 저장"을 누릅니다.
ApiKey_Steps_Vercel = 1. Vercel의 AI Gateway API 키 화면을 엽니다(필요하면 로그인/가입).\n2. API 키를 생성해 복사합니다. 무료 크레딧 활성화를 위해 유효한 카드를 요구받을 수 있습니다. 의도치 않은 과금을 막기 위해 키별 예산 한도도 설정하세요.\n3. 아래 입력란에 붙여넣고 "확인하고 저장"을 누릅니다.
ApiKey_Steps_OpenAI = 1. OpenAI Platform의 API 키 화면을 엽니다(필요하면 로그인).\n2. API 키를 생성해 복사합니다.\n3. 아래 입력란에 붙여넣고 "확인하고 저장"을 누릅니다.
ApiKey_Steps_Anthropic = 1. Anthropic Console의 API 키 화면을 열고 API 키를 생성해 복사합니다.\n2. 여러 Workspace에 걸친 personal/service-account 키라면 Settings → Workspaces의 wrkspc_... ID도 입력합니다. 단일 Workspace로 범위가 한정된 키라면 비워 두어도 됩니다.\n3. 키를 붙여넣고 "확인하고 저장"을 누릅니다.
ApiKey_Steps_Xai = 1. xAI 콘솔의 API 키 화면을 엽니다(필요하면 로그인/가입).\n2. API 키(xai-로 시작)를 생성해 복사합니다.\n3. 아래에 붙여넣고 "확인하고 저장"을 누릅니다.
# ApiKey_Steps_OVHcloud = 지원 지역 사용자가 실기 검증을 할 수 있을 때까지 비활성화
ApiKey_Not_Reached = 키를 검증하기 위해 서비스에 연결할 수 없었습니다

[Gpu]
Prompt_Title = GPU 가속
Prompt_Body = NVIDIA GPU를 사용할 수 있습니다. GPU 구성 요소({size})를 한 번 다운로드하여 로컬 태그 지정을 GPU로 실행하시겠습니까?(캡션 생성은 항상 CPU에서 동작합니다.) 다운로드하지 않아도 CPU로 기존과 동일하게 동작합니다.
Prompt_Download = 다운로드
Prompt_Later = 나중에
Prompt_Never = 사용 안 함(다음부터 묻지 않음)
Prompt_Size_Unknown = 약 1GB
Download_Start = GPU 구성 요소를 다운로드하는 중입니다...
Download_Progress_Label = GPU 구성 요소를 다운로드하는 중입니다...
Download_Progress_Detail = GPU 구성 요소를 다운로드하는 중... {done} / {total} MB
Download_Cancel = 취소
Download_Cancelling = GPU 구성 요소 다운로드를 중단하는 중입니다...
Download_Done_Restart = GPU 구성 요소를 설치했습니다. 앱을 재시작하면 GPU가 활성화됩니다.
Download_Failed = GPU 구성 요소를 설치하지 못했습니다. CPU로 계속 동작합니다.
Worker_NoSpec = 이 빌드에는 gpu_components.json이 없습니다(다운로드할 대상 없음).
Worker_Done = GPU 구성 요소 다운로드와 검증이 완료되었습니다.
Worker_Stopped = GPU 구성 요소 다운로드를 중단했습니다.
Worker_Failed = GPU 구성 요소 다운로드에 실패했습니다.
