ApiKey_Steps_Gemini = 1. Нажмите «Открыть страницу получения API-ключа» (при необходимости войдите в аккаунт Google).\n2. Создайте API-ключ и скопируйте его.\n3. Вставьте его в поле ниже и нажмите «Проверить и сохранить».
ApiKey_Steps_OpenRouter = 1. Нажмите «Открыть страницу получения API-ключа» (при необходимости войдите или зарегистрируйтесь в OpenRouter).\n2. Создайте ключ и скопируйте его.\n3. Вставьте его в поле ниже и нажмите «Проверить и сохранить».
ApiKey_Steps_Cloudflare = 1. Нажмите «Открыть страницу получения API-ключа» → откройте «Use REST API» в Workers AI и создайте Workers AI API Token из шаблона.\n2. Если создаёте токен вручную, предоставьте оба разрешения Account / Workers AI — Read и Edit, и укажите ниже также ID аккаунта.\n3. Вставьте токен и нажмите «Проверить и сохранить». Окно закроется только после успешного реального запроса изображения к Workers AI.
ApiKey_Steps_Generic = 1. Откройте страницу провайдера и при необходимости войдите в аккаунт.\n2. Создайте API-ключ и скопируйте его.\n3. Вставьте его в поле ниже и нажмите «Проверить и сохранить».
ApiKey_Steps_Groq = 1. Откройте страницу ключей в консоли Groq (при необходимости войдите или зарегистрируйтесь).\n2. Создайте API-ключ и скопируйте его.\n3. Вставьте его в поле ниже и нажмите «Проверить и сохранить».
ApiKey_Steps_Nvidia = 1. Откройте страницу API-ключей на build.nvidia.com (при необходимости войдите или зарегистрируйтесь).\n2. Выпустите API-ключ и скопируйте его.\n3. Вставьте его в поле ниже и нажмите «Проверить и сохранить».
ApiKey_Steps_Mistral = 1. Откройте страницу API-ключей в консоли Mistral (при необходимости войдите или зарегистрируйтесь).\n2. Создайте API-ключ и скопируйте его.\n3. Вставьте его в поле ниже и нажмите «Проверить и сохранить».
ApiKey_Steps_HuggingFace = 1. Откройте настройки токенов Hugging Face (при необходимости войдите или зарегистрируйтесь).\n2. Создайте fine-grained токен с правом вызова Inference Providers и скопируйте его.\n3. Вставьте его в поле ниже и нажмите «Проверить и сохранить».
ApiKey_Steps_Vercel = 1. Откройте страницу API-ключей Vercel AI Gateway (при необходимости войдите или зарегистрируйтесь).\n2. Создайте API-ключ и скопируйте его. Для активации бесплатных кредитов может потребоваться привязанная действующая карта. Установите лимит бюджета для каждого ключа, чтобы избежать непреднамеренных списаний.\n3. Вставьте его в поле ниже и нажмите «Проверить и сохранить».
ApiKey_Steps_OpenAI = 1. Откройте страницу API-ключей OpenAI Platform (при необходимости войдите в аккаунт).\n2. Создайте API-ключ и скопируйте его.\n3. Вставьте его в поле ниже и нажмите «Проверить и сохранить».
ApiKey_Steps_Anthropic = 1. Откройте страницу API-ключей в Anthropic Console, создайте API-ключ и скопируйте его.\n2. Для personal/service-account ключа, действующего на несколько Workspace, также введите ID wrkspc_... из Settings → Workspaces. Для ключа, ограниченного одним Workspace, оставьте поле пустым.\n3. Вставьте ключ и нажмите «Проверить и сохранить».
ApiKey_Steps_Xai = 1. Откройте страницу API-ключей в консоли xAI (при необходимости выполните вход или регистрацию).\n2. Создайте API-ключ (начинается с xai-) и скопируйте его.\n3. Вставьте его ниже и нажмите «Проверить и сохранить».
# ApiKey_Steps_OVHcloud = отключено, пока пользователь из поддерживаемого региона не сможет проверить на реальном устройстве
ApiKey_Not_Reached = Не удалось подключиться к сервису для проверки ключа

[Gpu]
Prompt_Title = Ускорение на GPU
Prompt_Body = Доступен GPU NVIDIA. Загрузить GPU-компоненты ({size}) один раз, чтобы выполнять локальное тегирование на GPU? (Создание описаний всегда выполняется на CPU.) Без загрузки приложение продолжит работать на CPU как раньше.
Prompt_Download = Загрузить
Prompt_Later = Не сейчас
Prompt_Never = Не использовать (больше не спрашивать)
Prompt_Size_Unknown = около 1 ГБ
Download_Start = Загрузка GPU-компонентов...
Download_Progress_Label = Загрузка GPU-компонентов...
Download_Progress_Detail = Загрузка GPU-компонентов... {done} / {total} МБ
Download_Cancel = Отмена
Download_Cancelling = Отмена загрузки GPU-компонентов...
Download_Done_Restart = GPU-компоненты установлены. Перезапустите приложение, чтобы включить GPU.
Download_Failed = Не удалось установить GPU-компоненты. Приложение продолжит работать на CPU.
Worker_NoSpec = В этой сборке нет файла gpu_components.json (загружать нечего).
Worker_Done = Загрузка и проверка GPU-компонентов завершены.
Worker_Stopped = Загрузка GPU-компонентов отменена.
Worker_Failed = Не удалось загрузить GPU-компоненты.
Use_Gpu_Checkbox = Использовать GPU
Use_Gpu_Tooltip = Выполняет локальное тегирование на GPU (CUDA) вместо CPU. Создание описаний всегда выполняется на CPU независимо от этой настройки.

[Updater]
Prompt_Title = Доступна новая версия
Prompt_Body = Вышла версия {version} (у вас {current}). Открыть страницу загрузки?
Prompt_Open = Открыть страницу загрузки
Prompt_Later = Не сейчас
Prompt_Skip = Пропустить эту версию (не спрашивать до выхода более новой)
