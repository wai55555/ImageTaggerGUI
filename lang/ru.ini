[ModelDescriptions]
pixai-tagger-v0.9 = 13 461 тег. Универсальная модель, но слабо распознаёт фон.
wd_eva02_large_v3 = 10 861 тег. Классический выбор — берите эту модель, если вас раздражают ложные срабатывания и тому подобное.
oppaioracle_v1_1 = 19 294 тега. Только теги категории General.
camie_tagger_v2 = 70 527 тегов. Отличается наличием определения тегов художника, но точность невысока, а из-за огромного числа тегов велик риск ложных срабатываний.
cl_tagger_1_02 = 51 213 тегов. Отличается тегами качества и тегами модели (26 шт.).
cl_tagger_v2_01a = 108 036 тегов. Сверхбольшой словарь, но тегов модели нет.
wd14_convnextv2 = 9 083 тега. Быстро работает.
wd_eva02_2026_canary = 16 473 тега. Экспериментальная новейшая модель WD-eva02.
florence2_base_ft = Генерирует описания на естественном языке.

