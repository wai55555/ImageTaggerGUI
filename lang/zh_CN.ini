ApiKey_Steps_Gemini = 1. 点击'打开获取 API 密钥的页面' (如需要请先登录 Google)。\n2. 创建 API 密钥并复制。\n3. 粘贴到下方栏中，然后点击'确认并保存'。
ApiKey_Steps_OpenRouter = 1. 点击'打开获取 API 密钥的页面' (如需要请先登录或注册 OpenRouter)。\n2. 创建密钥并复制。\n3. 粘贴到下方栏中，然后点击'确认并保存'。
ApiKey_Steps_Cloudflare = 1. 点击'打开获取 API 密钥的页面' → 打开 Workers AI 的'Use REST API'，从模板创建 Workers AI API Token。\n2. 如需自行创建令牌，请为 Account 授予 Workers AI 的 Read 和 Edit 两项权限，并在下方栏中输入账户 ID。\n3. 粘贴令牌并点击'确认并保存'。只有当对 Workers AI 的实际图像请求成功后，窗口才会关闭。
ApiKey_Steps_Generic = 1. 打开服务商页面，如需要请先登录。\n2. 创建 API 密钥并复制。\n3. 粘贴到下方栏中，然后点击'确认并保存'。
ApiKey_Steps_Groq = 1. 打开 Groq 控制台的密钥页面 (如需要请先登录或注册)。\n2. 创建 API 密钥并复制。\n3. 粘贴到下方栏中，然后点击'确认并保存'。
ApiKey_Steps_Nvidia = 1. 打开 build.nvidia.com 的 API 密钥页面 (如需要请先登录或注册)。\n2. 生成 API 密钥并复制。\n3. 粘贴到下方栏中，然后点击'确认并保存'。
ApiKey_Steps_Mistral = 1. 打开 Mistral 控制台的 API 密钥页面 (如需要请先登录或注册)。\n2. 创建 API 密钥并复制。\n3. 粘贴到下方栏中，然后点击'确认并保存'。
ApiKey_Steps_HuggingFace = 1. 打开 Hugging Face 的令牌设置 (如需要请先登录或注册)。\n2. 创建具有调用 Inference Providers 权限的 fine-grained 令牌并复制。\n3. 粘贴到下方栏中，然后点击'确认并保存'。
ApiKey_Steps_Vercel = 1. 打开 Vercel 的 AI Gateway API 密钥页面 (如需要请先登录或注册)。\n2. 创建 API 密钥并复制。启用免费额度可能还需要绑定有效卡片。为避免产生意外费用，请为每个密钥设置预算上限。\n3. 粘贴到下方栏中，然后点击'确认并保存'。
ApiKey_Steps_OpenAI = 1. 打开 OpenAI Platform 的 API 密钥页面 (如需要请先登录)。\n2. 创建 API 密钥并复制。\n3. 粘贴到下方栏中，然后点击'确认并保存'。
ApiKey_Steps_Anthropic = 1. 打开 Anthropic Console 的 API 密钥页面，创建 API 密钥并复制。\n2. 若是适用于多个 Workspace 的 personal/service-account key，还需输入 Settings → Workspaces 中的 wrkspc_... ID；若密钥仅限于单个 Workspace，则留空即可。\n3. 粘贴密钥并点击'确认并保存'。
ApiKey_Steps_Xai = 1. 打开 xAI 控制台的 API 密钥页面 (如需要请先登录或注册)。\n2. 创建以 xai- 开头的 API 密钥并复制。\n3. 粘贴到下方，然后点击'确认并保存'。
# ApiKey_Steps_OVHcloud = 在受支持地区的用户完成实机验证之前处于禁用状态
