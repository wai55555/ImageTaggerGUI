[ModelDescriptions]
pixai-tagger-v0.9 = 13,461 个标签。通用性强，但对背景的识别较弱
wd_eva02_large_v3 = 10,861 个标签。经典之选，若在意误判较多可选择此模型
oppaioracle_v1_1 = 19,294 个标签。仅包含 General 分类标签
camie_tagger_v2 = 70,527 个标签。特点是支持绘师标签检测，但精度不算高，且标签数量过多，误判风险较大
cl_tagger_1_02 = 51,213 个标签。特点是包含品质标签与模型标签 (26 个)
cl_tagger_v2_01a = 108,036 个标签。词表规模极大，但不含模型标签
wd14_convnextv2 = 9,083 个标签。运行速度快
wd_eva02_2026_canary = 16,473 个标签。实验性的最新 WD-eva02 模型
florence2_base_ft = 以自然语言生成图像描述

