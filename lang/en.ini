[ModelDescriptions]
pixai-tagger-v0.9 = 13,461 tags. General-purpose, but weak on backgrounds.
wd_eva02_large_v3 = 10,861 tags. The standard pick; choose this if false positives bother you.
oppaioracle_v1_1 = 19,294 tags. General tags only.
camie_tagger_v2 = 70,527 tags. artist-tag detection, though accuracy is modest and the very large tag count carries a high false-positive risk.
cl_tagger_1_02 = 51,213 tags. Notable for quality tags and model tags (26).
cl_tagger_v2_01a = 108,036 tags. very large vocabulary.
wd14_convnextv2 = 9,083 tags. Fast.
wd_eva02_2026_canary = 16,473 tags. Experimental, newest WD-eva02 model.
florence2_base_ft = Generates natural-language captions.

