ApiKey_Saved_Confirm = Connected successfully. The API key was saved to {where}.
ApiKey_Connected_Existing = Connected successfully using the registered API key. The connection settings were saved.
Custom_Insecure_Auth_Title = Unencrypted external connection
Custom_Insecure_Auth_Warning = This external URL uses plain HTTP. Image data and any configured API key can be intercepted in transit. Continue with this connection?
ApiKey_Saved_Model_Warning = The key was accepted and saved to {where}, but the request came back: {detail}. Fix the model id for this route and run Diagnose again.
ApiKey_Service_Warning = {success} However, the service cannot run requests yet: {detail}. Check the account's billing, payment method, or credit balance, then run Diagnose again.
ApiKey_Steps_Gemini = 1. Open the API key page (sign in to Google if asked).\n2. Create an API key and copy it.\n3. Paste it below and press "Verify and save".
ApiKey_Steps_OpenRouter = 1. Open the keys page (sign in / sign up to OpenRouter if needed).\n2. Create a key and copy it.\n3. Paste it below and press "Verify and save".
ApiKey_Steps_Cloudflare = 1. Open Workers AI, select "Use REST API", and create a Workers AI API Token from its template.\n2. If you create a custom token, grant both Account / Workers AI Read and Edit permissions, then enter your Account ID below.\n3. Paste the token and press "Verify and save". The dialog closes only after an actual Workers AI image request succeeds.
ApiKey_Steps_Generic = 1. Open the provider page and sign in if needed.\n2. Create an API key and copy it.\n3. Paste it below and press "Verify and save".
ApiKey_Steps_Groq = 1. Open the Groq console keys page (sign in / sign up if needed).\n2. Create an API key and copy it.\n3. Paste it below and press "Verify and save".
ApiKey_Steps_Nvidia = 1. Open build.nvidia.com API keys (sign in / sign up if needed).\n2. Generate an API key and copy it.\n3. Paste it below and press "Verify and save".
ApiKey_Steps_Mistral = 1. Open the Mistral console API keys page (sign in / sign up if needed).\n2. Create an API key and copy it.\n3. Paste it below and press "Verify and save".
ApiKey_Steps_HuggingFace = 1. Open Hugging Face token settings (sign in / sign up if needed).\n2. Create a fine-grained token with permission to call Inference Providers and copy it.\n3. Paste it below and press "Verify and save".
ApiKey_Steps_Vercel = 1. Open the Vercel AI Gateway API keys page (sign in / sign up if needed).\n2. Create and copy an API key. Vercel may require a valid card before unlocking its free credits; set a per-key budget to guard against unintended charges.\n3. Paste it below and press "Verify and save".
ApiKey_Steps_OpenAI = 1. Open the OpenAI Platform API keys page (sign in if needed).\n2. Create an API key and copy it.\n3. Paste it below and press "Verify and save".
ApiKey_Steps_Anthropic = 1. Open Anthropic Console, create an API key, and copy it.\n2. For a multi-workspace personal/service-account key, also enter the wrkspc_... ID from Settings → Workspaces. Leave it blank for a single-workspace key.\n3. Paste the key and press "Verify and save".
ApiKey_Steps_Xai = 1. Open the xAI console API keys page (sign in / sign up if needed).\n2. Create an API key (starts with xai-) and copy it.\n3. Paste it below and press "Verify and save".
# ApiKey_Steps_OVHcloud = disabled until a supported-region user can verify the service
ApiKey_Not_Reached = could not reach the service to verify the key

