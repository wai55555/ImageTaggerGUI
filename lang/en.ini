ApiKey_Header = Register your {service} API key. It is stored in the OS secret storage and never written to config files or logs.
ApiKey_Open_Key_Page = Open the API key page
ApiKey_Open_Login_Page = Open sign-in / sign-up
ApiKey_Current_Registered = A key is already registered ({where}). Paste a new one to replace it.
ApiKey_Current_Registered_Cloudflare = An API token is already registered ({where}). Enter the Account ID below; leave the token field empty to verify with the registered token, or paste a new token to replace it.
ApiKey_Current_Registered_Anthropic = An API key is already registered ({where}). To add or change only the Workspace ID, leave the key field blank; paste a new key only to replace it.
ApiKey_Current_None = No key registered yet.
ApiKey_Where_Keyring = OS secret storage
ApiKey_Where_Env = environment variable
