Prompt_Title = GPU acceleration
Prompt_Body = An NVIDIA GPU is available. Download the GPU components ({size}) once to run local tagging on the GPU? (Captioning always runs on the CPU.) The app keeps working on the CPU either way.
Prompt_Download = Download
Prompt_Later = Not now
Prompt_Never = Don't use / don't ask again
Prompt_Size_Unknown = about 1 GB
