Custom_Insecure_Auth_Title = Connexion externe non chiffrée
Custom_Insecure_Auth_Warning = Cette URL externe utilise du HTTP en clair. Les données d'image et toute clé API configurée peuvent être interceptées pendant la transmission. Continuer avec cette connexion ?
ApiKey_Saved_Model_Warning = La clé a été acceptée et enregistrée dans {where}, mais la requête a renvoyé : « {detail} ». Corrigez l'ID de modèle de cette route, puis relancez « Diagnostiquer ».
ApiKey_Service_Warning = {success} Cependant, le service ne peut pas encore exécuter de requêtes : {detail} Vérifiez la facturation du compte, le mode de paiement ou le solde de crédit, puis relancez « Diagnostiquer ».
ApiKey_Steps_Gemini = 1. Ouvrez la page de la clé API (connectez-vous à Google si demandé).\n2. Créez une clé API et copiez-la.\n3. Collez-la ci-dessous et cliquez sur « Vérifier et enregistrer ».
ApiKey_Steps_OpenRouter = 1. Ouvrez la page des clés (connectez-vous ou inscrivez-vous sur OpenRouter si nécessaire).\n2. Créez une clé et copiez-la.\n3. Collez-la ci-dessous et cliquez sur « Vérifier et enregistrer ».
ApiKey_Steps_Cloudflare = 1. Ouvrez Workers AI, sélectionnez « Use REST API », puis créez un Workers AI API Token à partir du modèle proposé.\n2. Si vous créez un jeton personnalisé, accordez les permissions Account / Workers AI Read et Edit, puis saisissez votre ID de compte ci-dessous.\n3. Collez le jeton et cliquez sur « Vérifier et enregistrer ». La fenêtre ne se ferme qu'après la réussite d'une requête d'image réelle vers Workers AI.
ApiKey_Steps_Generic = 1. Ouvrez la page du fournisseur et connectez-vous si nécessaire.\n2. Créez une clé API et copiez-la.\n3. Collez-la ci-dessous et cliquez sur « Vérifier et enregistrer ».
ApiKey_Steps_Groq = 1. Ouvrez la page des clés de la console Groq (connectez-vous ou inscrivez-vous si nécessaire).\n2. Créez une clé API et copiez-la.\n3. Collez-la ci-dessous et cliquez sur « Vérifier et enregistrer ».
ApiKey_Steps_Nvidia = 1. Ouvrez la page des clés API de build.nvidia.com (connectez-vous ou inscrivez-vous si nécessaire).\n2. Générez une clé API et copiez-la.\n3. Collez-la ci-dessous et cliquez sur « Vérifier et enregistrer ».
ApiKey_Steps_Mistral = 1. Ouvrez la page des clés API de la console Mistral (connectez-vous ou inscrivez-vous si nécessaire).\n2. Créez une clé API et copiez-la.\n3. Collez-la ci-dessous et cliquez sur « Vérifier et enregistrer ».
ApiKey_Steps_HuggingFace = 1. Ouvrez les paramètres de jetons Hugging Face (connectez-vous ou inscrivez-vous si nécessaire).\n2. Créez un jeton « fine-grained » autorisant l'appel des Inference Providers, puis copiez-le.\n3. Collez-le ci-dessous et cliquez sur « Vérifier et enregistrer ».
ApiKey_Steps_Vercel = 1. Ouvrez la page des clés API de Vercel AI Gateway (connectez-vous ou inscrivez-vous si nécessaire).\n2. Créez et copiez une clé API. Vercel peut exiger une carte valide avant de débloquer ses crédits gratuits ; définissez un budget par clé pour éviter tout coût imprévu.\n3. Collez-la ci-dessous et cliquez sur « Vérifier et enregistrer ».
ApiKey_Steps_OpenAI = 1. Ouvrez la page des clés API d'OpenAI Platform (connectez-vous si nécessaire).\n2. Créez une clé API et copiez-la.\n3. Collez-la ci-dessous et cliquez sur « Vérifier et enregistrer ».
ApiKey_Steps_Anthropic = 1. Ouvrez Anthropic Console, créez une clé API et copiez-la.\n2. Pour une clé personnelle ou de compte de service couvrant plusieurs workspaces, saisissez également l'ID wrkspc_... depuis Settings → Workspaces. Laissez ce champ vide pour une clé limitée à un seul workspace.\n3. Collez la clé et cliquez sur « Vérifier et enregistrer ».
ApiKey_Steps_Xai = 1. Ouvrez la page des clés API de la console xAI (connectez-vous ou inscrivez-vous si nécessaire).\n2. Créez une clé API (commençant par xai-) et copiez-la.\n3. Collez-la ci-dessous et cliquez sur « Vérifier et enregistrer ».
# ApiKey_Steps_OVHcloud = désactivé jusqu'à ce qu'un utilisateur d'une région prise en charge puisse le vérifier en conditions réelles
ApiKey_Not_Reached = impossible de joindre le service pour vérifier la clé

[Gpu]
Prompt_Title = Accélération GPU
Prompt_Body = Un GPU NVIDIA est disponible. Télécharger une fois les composants GPU ({size}) pour exécuter le taggage local sur le GPU ? (La génération de légendes fonctionne toujours sur le CPU.) L'application continue de fonctionner sur le CPU dans tous les cas.
