ApiKey_Steps_Gemini = 1. 按下「開啟 API 金鑰頁面」(如有需要，請登入 Google)。\n2. 建立 API 金鑰並複製。\n3. 貼到下方欄位，然後按下「確認並儲存」。
ApiKey_Steps_OpenRouter = 1. 按下「開啟 API 金鑰頁面」(如有需要，請登入 / 註冊 OpenRouter)。\n2. 建立金鑰並複製。\n3. 貼到下方欄位，然後按下「確認並儲存」。
ApiKey_Steps_Cloudflare = 1. 按下「開啟 API 金鑰頁面」，開啟 Workers AI 的「Use REST API」，並從範本建立 Workers AI API 權杖。\n2. 若要自行建立權杖，請同時授予 Account 的 Workers AI Read 與 Edit 兩項權限，並在下方輸入帳戶 ID。\n3. 貼上權杖，然後按下「確認並儲存」。只有在對 Workers AI 送出實際圖片請求並成功後，視窗才會關閉。
ApiKey_Steps_Generic = 1. 開啟提供者的頁面，如有需要請登入。\n2. 建立 API 金鑰並複製。\n3. 貼到下方欄位，然後按下「確認並儲存」。
ApiKey_Steps_Groq = 1. 開啟 Groq 主控台的金鑰頁面 (如有需要，請登入 / 註冊)。\n2. 建立 API 金鑰並複製。\n3. 貼到下方欄位，然後按下「確認並儲存」。
ApiKey_Steps_Nvidia = 1. 開啟 build.nvidia.com 的 API 金鑰頁面 (如有需要，請登入 / 註冊)。\n2. 產生 API 金鑰並複製。\n3. 貼到下方欄位，然後按下「確認並儲存」。
ApiKey_Steps_Mistral = 1. 開啟 Mistral 主控台的 API 金鑰頁面 (如有需要，請登入 / 註冊)。\n2. 建立 API 金鑰並複製。\n3. 貼到下方欄位，然後按下「確認並儲存」。
ApiKey_Steps_HuggingFace = 1. 開啟 Hugging Face 的權杖設定頁面 (如有需要，請登入 / 註冊)。\n2. 建立具備呼叫 Inference Providers 權限的 fine-grained 權杖並複製。\n3. 貼到下方欄位，然後按下「確認並儲存」。
ApiKey_Steps_Vercel = 1. 開啟 Vercel AI Gateway 的 API 金鑰頁面 (如有需要，請登入 / 註冊)。\n2. 建立並複製 API 金鑰。Vercel 可能會要求提供有效的信用卡才會解鎖免費額度；請為每組金鑰設定用量上限，以避免產生非預期的費用。\n3. 貼到下方欄位，然後按下「確認並儲存」。
ApiKey_Steps_OpenAI = 1. 開啟 OpenAI Platform 的 API 金鑰頁面 (如有需要請登入)。\n2. 建立 API 金鑰並複製。\n3. 貼到下方欄位，然後按下「確認並儲存」。
ApiKey_Steps_Anthropic = 1. 開啟 Anthropic Console，建立 API 金鑰並複製。\n2. 若為適用多個 Workspace 的 personal / service-account 金鑰，請同時輸入 Settings → Workspaces 中的 wrkspc_... ID；若金鑰僅適用單一 Workspace，則留空即可。\n3. 貼上金鑰，然後按下「確認並儲存」。
ApiKey_Steps_Xai = 1. 開啟 xAI 主控台的 API 金鑰頁面 (如有需要，請登入 / 註冊)。\n2. 建立 API 金鑰 (以 xai- 開頭) 並複製。\n3. 貼到下方欄位，然後按下「確認並儲存」。
# ApiKey_Steps_OVHcloud = 停用中，待有支援地區的使用者完成實機驗證後開放
