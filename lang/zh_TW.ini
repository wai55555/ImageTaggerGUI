[ModelDescriptions]
pixai-tagger-v0.9 = 13,461 個標籤。泛用性佳，但對背景辨識較弱。
wd_eva02_large_v3 = 10,861 個標籤。經典首選，若在意誤判過多可選這個。
oppaioracle_v1_1 = 19,294 個標籤。僅有 General 標籤。
camie_tagger_v2 = 70,527 個標籤。特色是具備繪師標籤偵測，不過準確度不高，且標籤數量過多，誤判風險較大。
cl_tagger_1_02 = 51,213 個標籤。以品質標籤與模型標籤 (26 個) 為特色。
cl_tagger_v2_01a = 108,036 個標籤。詞彙量極為龐大，且無模型標籤。
wd14_convnextv2 = 9,083 個標籤。執行速度快。
wd_eva02_2026_canary = 16,473 個標籤。實驗性的最新 WD-eva02 模型。
florence2_base_ft = 以自然語言產生描述文字。

